<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010a10">
<title>J.A.R.V.I.S.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--c:#3de8ff;--c2:#1aa8c4;--dim:#0b3a47;--bg:#010a10;--tx:#cdf7ff}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:600 16px/1.35 Rajdhani,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden;background:linear-gradient(90deg,transparent,rgba(61,232,255,.5),transparent) 0 24%/100% 1px no-repeat,linear-gradient(90deg,transparent 10%,rgba(61,232,255,.35),transparent 90%) 0 58%/100% 1px no-repeat,linear-gradient(90deg,rgba(61,232,255,.4),transparent 70%) 0 81%/100% 1px no-repeat,radial-gradient(70% 55% at 50% 42%,#06384a 0,#021722 55%,var(--bg) 100%)}
.wrap{max-width:1180px;margin:0 auto;padding:10px 12px 40px}
.ruler{display:flex;gap:2px;overflow-x:auto;font:500 11px Orbitron,sans-serif;color:#8fd9e8;padding-bottom:6px;border-bottom:1px solid var(--dim);margin-bottom:12px;align-items:center}
.ruler span{flex:1 0 20px;text-align:center;padding:2px 0}
.ruler .now{background:var(--c);color:var(--bg);font-weight:700;box-shadow:0 0 12px var(--c)}
.ruler em{font-style:normal;flex:0 0 auto;padding:0 8px;color:#6dffb0}
.ruler em.off{color:#ff7a7a}
.hud{display:grid;gap:14px}
.C{order:-1}
@media(min-width:900px){.hud{grid-template-columns:236px 1fr 270px}.C{order:0}}
.col{display:flex;flex-direction:column;gap:12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ring{position:relative;aspect-ratio:1}
.ring svg{width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(61,232,255,.7))}
.ring circle{fill:none;stroke:var(--c)}
.ring .t{stroke-opacity:.18;stroke-width:7}
.ring .a{stroke-width:7;transition:stroke-dasharray .8s}
.ring .o{stroke-width:.8;stroke-dasharray:1.5 2.5;stroke-opacity:.7}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rt b{font:700 21px Orbitron,sans-serif;text-shadow:0 0 10px var(--c)}
.rt small{font-size:12px;color:#8fd9e8}
.panel{border:1px solid var(--dim);border-left:2px solid var(--c);background:rgba(3,40,54,.45);padding:10px 12px;box-shadow:inset 0 0 18px rgba(61,232,255,.06)}
.panel h2{margin:0 0 8px;font:500 12px Orbitron,sans-serif;letter-spacing:.14em;color:var(--c);display:flex;justify-content:space-between}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(61,232,255,.15);color:var(--tx);font:inherit;padding:9px 2px;cursor:pointer}
.menu button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.menu button:hover,.menu button:focus-visible{color:var(--c);outline:0}
.core{width:100%;max-width:460px;margin:0 auto;display:block;filter:drop-shadow(0 0 16px rgba(61,232,255,.45))}
.core g{transform-origin:200px 200px}
.s1{animation:sp 60s linear infinite}.s2{animation:sp 30s linear infinite reverse}.s3{animation:sp 18s linear infinite}.s4{animation:sp 24s linear infinite}.s5{animation:sp 9s linear infinite reverse}
.think .s2{animation-duration:6s}.think .s5{animation-duration:2s}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{50%{opacity:.6}}
.cg{animation:pl 3s ease-in-out infinite}
.reply{white-space:pre-wrap;min-height:3em;max-height:260px;overflow:auto;padding:10px 12px;border:1px solid var(--dim);border-left:3px solid var(--c);background:rgba(3,40,54,.5);font-size:17px;margin:6px 0 8px}
.reply.busy{opacity:.6}
.in{display:flex;gap:8px;border:1px solid var(--c2);padding:6px;background:rgba(0,0,0,.4);box-shadow:0 0 18px rgba(61,232,255,.2)}
.in input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;padding:0 6px}
.b{background:transparent;border:1px solid var(--c2);color:var(--c);font:500 11px Orbitron,sans-serif;letter-spacing:.1em;padding:8px 12px;cursor:pointer}
.b:hover,.b:focus-visible{background:var(--c);color:var(--bg);outline:0}
.task{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid rgba(61,232,255,.15)}
.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;opacity:.5}
.task input{accent-color:var(--c)}
.task button{background:transparent;border:0;color:#6fb8c8;font-size:18px;cursor:pointer}
.add{display:flex;gap:6px;margin-bottom:6px}
.add input,.af input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--dim);color:var(--tx);font:inherit;padding:7px}
.add input:focus-visible,.af input:focus-visible{border-color:var(--c);outline:0}
.dock{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.dock a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx);text-decoration:none;font-size:13px;width:78px;text-align:center}
.dock i{width:54px;height:54px;border:1px solid var(--c);border-radius:50%;display:grid;place-items:center;font:700 15px Orbitron,sans-serif;font-style:normal;color:var(--c);box-shadow:0 0 12px rgba(61,232,255,.4),inset 0 0 12px rgba(61,232,255,.15)}
.tot{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.tot b{display:block;font:700 20px Orbitron,sans-serif;color:var(--c)}
.af{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.af .f{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid rgba(61,232,255,.15);font-size:14px}
.row a{flex:1 1 100%;color:var(--c);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b{padding:4px 8px}
.mu{opacity:.65;font-size:14px}
@media(prefers-reduced-motion:reduce){.core g,.cg{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="ruler" id="ruler"></div>
<div class="hud">
  <aside class="col">
    <div class="rings" id="rl"></div>
    <div class="panel"><h2>ATALHOS DE IA</h2><div class="menu" id="menu"></div></div>
  </aside>

  <main class="C">
    <svg class="core" id="core" viewBox="0 0 400 400" aria-hidden="true">
      <defs><radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#9fe9ff"/><stop offset=".55" stop-color="#1b86d8"/><stop offset="1" stop-color="#1b86d8" stop-opacity="0"/></radialGradient></defs>
      <g fill="none" stroke="#3de8ff">
        <g class="s1"><circle cx="200" cy="200" r="192" stroke-width="8" stroke-dasharray="1.5 6.3" opacity=".7"/></g>
        <g class="s2"><circle cx="200" cy="200" r="172" stroke-width="12" stroke-dasharray="220 70 130 80 170 60" opacity=".8"/></g>
        <path d="M92 132A128 128 0 0 0 74 218" stroke="#ff4d4d" stroke-width="5"/>
        <g class="s3"><circle cx="200" cy="200" r="146" stroke-width="2" stroke-dasharray="3 7"/></g>
        <g class="s4"><circle cx="200" cy="200" r="122" stroke-width="20" stroke-dasharray="180 50 100 60" opacity=".35"/></g>
        <circle cx="200" cy="200" r="96" stroke-width="2" opacity=".7"/>
        <g class="s5"><circle cx="200" cy="200" r="78" stroke-width="7" stroke-dasharray="70 28"/></g>
        <circle cx="200" cy="200" r="60" stroke-width="2"/>
      </g>
      <circle class="cg" cx="200" cy="200" r="52" fill="url(#g)"/>
    </svg>
    <div class="reply" id="reply">JARVIS online. Sistemas neurais ativos. Aguardando sua ordem, senhor.</div>
    <div class="in"><input id="in" placeholder="Pesquise ou pergunte ao JARVIS…" autocomplete="off" aria-label="Comando"><button class="b" id="go" type="button">ENVIAR</button></div>
  </main>

  <aside class="col">
    <div class="rings" id="rr"></div>
    <div class="panel"><h2>TAREFAS <span id="tcount">0/0</span></h2>
      <div class="add"><input id="tin" placeholder="Nova tarefa…" aria-label="Nova tarefa" maxlength="120"><button class="b" id="tadd" type="button">+</button></div>
      <div id="tl"></div>
    </div>
    <div class="panel"><h2>REDE E IA</h2>
      <svg viewBox="0 0 120 36" preserveAspectRatio="none" width="100%" height="48" aria-hidden="true"><line x1="0" y1="35" x2="120" y2="35" stroke="#0b3a47"/><polyline id="gl" fill="none" stroke="#3de8ff" stroke-width="1.5" points=""/></svg>
      <div class="mu" id="netv">Conexão —</div>
    </div>
  </aside>
</div>

<nav class="dock" aria-label="Atalhos">
  <a href="https://affiliate.shopee.com.br" target="_blank" rel="noopener noreferrer"><i>SP</i>Shopee Afiliados</a>
  <a href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer"><i>TT</i>TikTok</a>
  <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><i>YT</i>YouTube</a>
  <a href="https://www.canva.com" target="_blank" rel="noopener noreferrer"><i>CV</i>Canva</a>
</nav>

<section class="panel"><h2>AFILIADOS SHOPEE</h2>
  <div class="tot"><span>Cliques<b id="tc">0</b></span><span>Vendas<b id="ts">0</b></span><span>Comissão estimada<b id="tm">R$ 0,00</b></span></div>
  <div class="af">
    <input class="f" id="an" placeholder="Nome do produto" aria-label="Nome do produto">
    <input class="f" id="al" placeholder="Link de afiliado (https://…)" aria-label="Link de afiliado">
    <input id="ap" type="number" min="0" step="0.01" placeholder="Preço R$" aria-label="Preço">
    <input id="ac" type="number" min="0" max="100" step="0.1" placeholder="Comissão %" aria-label="Comissão em porcentagem">
    <button class="b f" id="aa" type="button">ADICIONAR PRODUTO</button>
  </div>
  <div id="al-list"></div>
</section>
</div>

<script>
var $=function(i){return document.getElementById(i)};
function p2(n){return String(n).padStart(2,"0")}
var days=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var months=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function saud(h){return h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}

function ring(box,id){box.insertAdjacentHTML("beforeend",'<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="t" cx="50" cy="50" r="42"/><circle class="a" id="'+id+'" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 50 50)"/><circle class="o" cx="50" cy="50" r="47"/></svg><div class="rt"><b id="'+id+'b">—</b><small id="'+id+'s"></small></div></div>')}
function setRing(id,pct,big,small){$(id).setAttribute("stroke-dasharray",Math.max(0,Math.min(100,pct))+" 100");$(id+"b").textContent=big;$(id+"s").textContent=small}
ring($("rl"),"rd");ring($("rl"),"rc");ring($("rl"),"rm");ring($("rl"),"rb");
ring($("rr"),"rk");ring($("rr"),"ri");

var now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),ru=$("ruler");
for(var i=1;i<=dim;i++){var s=document.createElement("span");s.textContent=p2(i);if(i===now.getDate())s.className="now";ru.appendChild(s)}
var st=document.createElement("em");st.id="st";ru.appendChild(st);
function online(){var on=navigator.onLine;st.textContent=on?"ONLINE":"SEM INTERNET";st.className=on?"":"off"}
online();addEventListener("online",online);addEventListener("offline",online);

function tick(){var d=new Date();
  setRing("rk",d.getSeconds()/60*100,p2(d.getHours())+":"+p2(d.getMinutes()),days[d.getDay()].slice(0,3)+" "+p2(d.getSeconds())+"s");
  setRing("rd",d.getDate()/dim*100,d.getDate(),months[d.getMonth()])}
tick();setInterval(tick,1000);

var lat=[],lastMs=0;
function dev(){var c=navigator.connection,cores=navigator.hardwareConcurrency,mem=navigator.deviceMemory;
  setRing("rc",cores?Math.min(100,cores/16*100):0,cores?cores:"—","núcleos CPU");
  setRing("rm",mem?Math.min(100,mem/8*100):0,mem?mem+" GB":"—","memória");
  setRing("ri",lastMs?Math.min(100,lastMs/60):0,lastMs?(lastMs/1000).toFixed(1)+"s":"—","resposta IA");
  $("netv").textContent=c&&c.effectiveType?"Conexão "+c.effectiveType.toUpperCase()+(c.downlink?" · "+c.downlink+" Mb/s":""):"Conexão —"}
dev();setInterval(dev,3000);
setRing("rb",0,"—","bateria");
if(navigator.getBattery){navigator.getBattery().then(function(b){
  function u(){var v=Math.round(b.level*100);setRing("rb",v,v+"%",b.charging?"carregando":"bateria")}
  u();b.onlevelchange=u;b.onchargingchange=u}).catch(function(){})}
function graph(){var n=lat.slice(-20);
  $("gl").setAttribute("points",n.map(function(v,i){return (n.length>1?i*120/(n.length-1):60).toFixed(1)+","+(34-Math.min(v,6000)/6000*32).toFixed(1)}).join(" "))}

var TK="jarvis-tarefas",tasks=[];
try{tasks=JSON.parse(localStorage.getItem(TK)||"[]")}catch(e){tasks=[]}
if(!Array.isArray(tasks))tasks=[];
function saveT(){try{localStorage.setItem(TK,JSON.stringify(tasks))}catch(e){}}
function renderT(){var box=$("tl"),done=0;box.textContent="";
  tasks.forEach(function(t,i){if(t.d)done++;
    var r=document.createElement("label");r.className="task"+(t.d?" done":"");
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!t.d;cb.onchange=function(){t.d=cb.checked;saveT();renderT()};
    var s=document.createElement("span");s.textContent=t.t;
    var x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","Remover tarefa");x.onclick=function(e){e.preventDefault();tasks.splice(i,1);saveT();renderT()};
    r.append(cb,s,x);box.appendChild(r)});
  if(!tasks.length){var h=document.createElement("div");h.className="mu";h.textContent="Nenhuma tarefa. Escreva a primeira.";box.appendChild(h)}
  $("tcount").textContent=done+"/"+tasks.length}
$("tadd").onclick=function(){var v=$("tin").value.trim();if(!v)return;tasks.push({t:v.slice(0,120),d:false});$("tin").value="";saveT();renderT()};
$("tin").addEventListener("keydown",function(e){if(e.key==="Enter")$("tadd").click()});
renderT();

var AK="jarvis-afiliados",items=[];
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
try{items=JSON.parse(localStorage.getItem(AK)||"[]")}catch(e){items=[]}
if(!Array.isArray(items))items=[];
function saveAff(){try{localStorage.setItem(AK,JSON.stringify(items))}catch(e){}}
function totals(){var c=0,s=0,m=0;items.forEach(function(it){c+=it.clicks;s+=it.sales;m+=it.sales*it.price*it.pct/100});return{c:c,s:s,m:m}}
function renderAff(){var box=$("al-list");box.textContent="";
  if(!items.length){var h=document.createElement("div");h.className="mu";h.textContent="Nenhum produto ainda. Cole um link de afiliado acima.";box.appendChild(h)}
  items.forEach(function(it,i){
    var r=document.createElement("div");r.className="row";
    var a=document.createElement("a");a.textContent=it.name;a.target="_blank";a.rel="noopener noreferrer";
    if(/^https?:\/\//i.test(it.link))a.href=it.link;
    function sp(t){var x=document.createElement("span");x.textContent=t;return x}
    function b(t,fn){var x=document.createElement("button");x.type="button";x.className="b";x.textContent=t;x.onclick=function(){fn();saveAff();renderAff()};return x}
    r.append(a,sp(brl(it.price)),sp(it.pct+"% por venda"),sp(it.clicks+" cliques"),sp(it.sales+" vendas"),b("+ CLIQUE",function(){it.clicks++}),b("+ VENDA",function(){it.sales++}),b("REMOVER",function(){items.splice(i,1)}));
    box.appendChild(r)});
  var t=totals();$("tc").textContent=t.c;$("ts").textContent=t.s;$("tm").textContent=brl(t.m)}
$("aa").onclick=function(){
  var n=$("an").value.trim(),l=$("al").value.trim(),pr=parseFloat($("ap").value)||0,pc=parseFloat($("ac").value)||0;
  if(!n||!/^https?:\/\//i.test(l)){say("Informe o nome do produto e um link que comece com https://.");return}
  items.push({name:n,link:l,price:pr,pct:pc,clicks:0,sales:0});saveAff();renderAff();
  ["an","al","ap","ac"].forEach(function(k){$(k).value=""})};
renderAff();

var quick=[
  ["Ideias de vídeo","Me dê 5 ideias de vídeos curtos para TikTok divulgando produtos como afiliado Shopee, cada uma com gancho pronto."],
  ["Plano de campanha","Monte um plano de campanha de 7 dias para vender como afiliado, com as ações de cada dia."],
  ["Copy de anúncio","Escreva 3 copys curtas de anúncio para um produto de afiliado, com gancho e chamada para ação."],
  ["Fontes de tráfego","Quais são as melhores fontes de tráfego gratuito e pago para afiliados hoje? Priorize por custo-benefício."],
  ["Escolher nicho","Como analisar e escolher um nicho lucrativo para afiliados? Dê um passo a passo prático."]
];
quick.forEach(function(q){var b=document.createElement("button");b.type="button";b.textContent=q[0];b.onclick=function(){send(q[1])};$("menu").appendChild(b)});

function say(t){$("reply").textContent=t}
function localAnswer(v){var d=new Date(),q=v.toLowerCase();
  if(/^(ajuda|help|comandos)$/.test(q))return "Use os atalhos à esquerda ou pergunte qualquer coisa sobre afiliados, campanhas, tráfego, conteúdo e negócios digitais. Comandos locais: hora, data, afiliados, tarefas.";
  if(q==="hora")return "São "+p2(d.getHours())+":"+p2(d.getMinutes())+", senhor.";
  if(q==="data")return "Hoje é "+days[d.getDay()]+", "+d.getDate()+" de "+months[d.getMonth()]+".";
  if(/^ol[aá]$|^oi$/.test(q))return saud(d.getHours())+", senhor. Em que posso ajudar?";
  if(q==="afiliados"){var t=totals();return items.length+" produtos, "+t.c+" cliques, "+t.s+" vendas. Comissão estimada: "+brl(t.m)+"."}
  if(q==="tarefas"){var n=tasks.filter(function(x){return x.d}).length;return n+" de "+tasks.length+" tarefas concluídas."}
  return null}
function getPin(){var p="";try{p=sessionStorage.getItem("jv-pin")||""}catch(e){}
  if(!p){p=prompt("PIN de acesso do JARVIS (deixe vazio se não configurou):")||"";try{sessionStorage.setItem("jv-pin",p)}catch(e){}}
  return p}
var busy=false;
function send(txt){
  var v=(typeof txt==="string"?txt:$("in").value).trim();if(!v)return;$("in").value="";
  var l=localAnswer(v);if(l){say(l);return}
  if(busy)return;busy=true;say("Processando…");
  $("reply").classList.add("busy");$("core").classList.add("think");
  var t0=Date.now();
  fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:v,pin:getPin()})})
    .then(function(r){return r.json()})
    .then(function(d){lastMs=Date.now()-t0;lat.push(lastMs);graph();dev();say(d.text||d.error||"Sem resposta.");
      if(d.error==="PIN incorreto."){try{sessionStorage.removeItem("jv-pin")}catch(e){}}})
    .catch(function(){say("Não consegui consultar agora. Tente de novo.")})
    .finally(function(){busy=false;$("reply").classList.remove("busy");$("core").classList.remove("think")})}
$("go").onclick=function(){send()};
$("in").addEventListener("keydown",function(e){if(e.key==="Enter")send()});
</script>
  <script src="voz.js"></script>
</body>
</html>
